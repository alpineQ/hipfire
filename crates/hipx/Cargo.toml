[package]
name = "hipx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust-native AMD XDNA / AIE-2P NPU compute — direct ioctl bypass of XRT and AMD Ryzen AI runtime, sister to redline"

[dependencies]
libc = "0.2"
libloading = "0.8"

[[bin]]
name = "hipx-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "hipx-bo-roundtrip"
path = "src/bin/bo_roundtrip.rs"

[[bin]]
name = "hipx-hwctx-roundtrip"
path = "src/bin/hwctx_roundtrip.rs"

[[bin]]
name = "hipx-overview"
path = "src/bin/overview.rs"

[[bin]]
name = "hipx-passthrough"
path = "src/bin/passthrough.rs"

[[bin]]
name = "hipx-vec-scalar-mul"
path = "src/bin/vec_scalar_mul.rs"

[[bin]]
name = "hipx-passthrough-dmas"
path = "src/bin/passthrough_dmas.rs"

[[bin]]
name = "hipx-matvec"
path = "src/bin/matvec.rs"

[[bin]]
name = "hipx-matmul-512"
path = "src/bin/matmul_512.rs"

[[bin]]
name = "hipx-matmul-i8"
path = "src/bin/matmul_i8.rs"

[[bin]]
name = "hipx-matmul-i8-1024"
path = "src/bin/matmul_i8_1024.rs"

[[bin]]
name = "hipx-matmul-i8-2048"
path = "src/bin/matmul_i8_2048.rs"

[[bin]]
name = "hipx-matmul-bf16"
path = "src/bin/matmul_bf16.rs"

[[bin]]
name = "hipx-matmul-bf16-1024"
path = "src/bin/matmul_bf16_1024.rs"
